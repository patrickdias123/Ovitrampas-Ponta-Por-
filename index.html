<script>
function destacarOvitrampas() {

    var val = document.getElementById('search-input').value;

    if(!val) return;

    var ids = val.split(/[ ,./-]+/);

    ids.forEach(function(id){

        id = id.trim();

        if(id === "") return;

        window.ovitrampas.forEach(function(ov){

            if(ov.id == id){

                for (var i in window){

                    if(window[i] instanceof L.Map){

                        window[i].setView([ov.lat, ov.lon], 18, {
                            animate: true,
                            duration: 1.5
                        });

                        L.circleMarker([ov.lat, ov.lon], {
                            radius: 18,
                            color: '#2563eb',
                            fillColor: '#60a5fa',
                            fillOpacity: 0.9,
                            weight: 6
                        }).addTo(window[i]);

                    }
                }

            }

        });

    });

}

function corrigirMapa() {
    for (var i in window){
        if (window[i] instanceof L.Map){
            window[i].invalidateSize();
            window[i].setView([-22.5304, -55.6600], 13);
        }
    }
}
setTimeout(corrigirMapa, 500);
window.addEventListener('resize', corrigirMapa);
