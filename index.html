<style>
html, body{ height: 100%; margin: 0; padding: 0; font-family:Arial, Helvetica, sans-serif; }
.leaflet-container { height: 100vh !important; }

.card{ position:fixed; z-index:9999; background:rgba(255,255,255,.95); border:1px solid #e5e7eb; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,.08); }

/* TOPBAR - Ajustado para centralizar logo e título sem mudar sua estrutura */
#topbar{ 
    top:10px; left:12px; right:12px; 
    height:65px; 
    padding:0 15px; 
    display:flex; 
    align-items:center; /* Centraliza verticalmente */
}

#title{ 
    display:flex; 
    align-items:center; /* Alinha logo e texto na mesma linha */
    gap:15px; 
    width:100%; 
    height:100%; 
}

#logo-img{ 
    height:52px; 
    width:auto; 
    display:block; 
}

#title-text-container{ 
    display:flex; 
    flex-direction:column; 
    justify-content:center; 
    height:100%; 
}

#title-main{ font-size:19px; font-weight:800; color:#111827; line-height:1.1; margin:0; }
#title-sub{ font-size:13px; font-weight:600; color:#4b5563; margin-top:3px; }

/* KPIs */
.kpi{ top:85px; width:180px; padding:10px; display:flex; flex-direction:column; justify-content:center; }
#kpi1{left:12px;} #kpi2{left:204px;} #kpi3{left:396px;}
/* Esconder IDO (kpi3) no celular e manter no desktop */
#kpi3{ display: none; }

@media (min-width: 768px) {
    #kpi3 { display: flex; left: 396px; }
}

/* PAINEL DE BUSCA - Exatamente como você pediu */
#search-panel { top: 165px; left: 12px; width: 180px; padding: 12px; border: 2px solid #2563eb; }
#search-input { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #d1d5db; font-size: 13px; outline: none; box-sizing: border-box; }
#search-input:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.2); }

.kpi-label{ font-size:8px; color:#6b7280; font-weight:700; text-transform:uppercase; line-height:1.1; margin-bottom:2px; }
.kpi-value{ font-size:19px; font-weight:800; color:#111827; }

/* LEGENDA - Garantindo que apareça no canto inferior */
#legend{ left:12px; bottom:20px; width:220px; padding:10px; font-size:10px; line-height:1.6; }
.legend-item{ display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }

/* SELETOR DE MAPAS (LayerControl) - Para não ficar obstruído e ser clicável */
.leaflet-top.leaflet-right { 
    top: 10px !important; 
    z-index: 10000 !important; 
}

    #kpi1 { left: 10px; }

    #search-panel { top: 145px; width: 130px; padding: 8px; }
    #legend { width: 180px; bottom: 15px; font-size: 9px; }
}
</style>




<script>
function destacarOvitrampas() {
    window.hM = window.hM || []; window.hM.forEach(m => m.remove()); window.hM = [];
    var val = document.getElementById('search-input').value; if(!val) return;
    var ids = val.split(/[ ,./-]+/);
    ids.forEach(id => {
        window.ovitrampas.forEach(ov => {
            if(ov.id == id.trim()){
                for (var i in window){ if(window[i] instanceof L.Map){
                    window[i].setView([ov.lat, ov.lon], 18);
                    var m = L.circleMarker([ov.lat, ov.lon], {radius: 15, color: '#db2777', weight: 4, fillColor: '#f472b6', fillOpacity: 0.4}).addTo(window[i]);
                    m.bindPopup('<b>Ovitrampa ' + ov.id + '</b><br>Ovos: ' + ov.ovos).openPopup();
                    window.hM.push(m);
                }}
            }
        });
    });
}
</script>
