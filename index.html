<script>
function destacarOvitrampas() {
    window.hM = window.hM || []; window.hM.forEach(m => m.remove()); window.hM = [];
    var val = document.getElementById('search-input').value; if(!val) return;
    var ids = val.split(/[ ,./-]+/);
    ids.forEach(id => {
        window.ovitrampas.forEach(ov => {
            if(ov.id == id.trim()){
                for (var i in window){ if(window[i] instanceof L.Map){
                    window[i].setView([ov.lat, ov.lon], 18);
                    // COLE ESTE NO LUGAR:
var m = L.circleMarker([ov.lat, ov.lon], {
    radius: 18, 
    color: '#db2777', 
    weight: 6,
    fillColor: '#f472b6',
    fillOpacity: 0.4
}).addTo(window[i]);

// Popup com todas as informações restauradas
m.bindPopup(`
    <div style="font-family:Arial; min-width:90px;">
        <b style="font-size:10px;">Ovitrampa ${ov.id}</b><br>
        <hr style="margin:5px 0;">
        <b>Ovos:</b> ${ov.ovos}<br>
        <b>Endereço:</b><br>${ov.rua}, ${ov.numero}
    </div>
`).openPopup(); 

window.hM.push(m);
                }}
            }
        });
    });
}
</script>
