html, body{

}

/* mover controle */
.leaflet-top.leaflet-right .leaflet-control-layers{
    margin-top:95px !important;
    margin-right:16px !important;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.10);
}

/* cards */
.card{
    position:fixed;
    z-index:9999;
    background:rgba(255,255,255,.96);
    border:1px solid #e5e7eb;
    border-radius:16px;
    box-shadow:0 12px 30px rgba(0,0,0,.08);
    backdrop-filter: blur(8px);
}

/* header */
#topbar{
    top:14px;
    left:18px;
    right:18px;
    height:62px;
    padding:10px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

#title{
    display:flex;
    align-items:center;
    gap:12px;
}

#title-main{
    font-size:22px;
    font-weight:800;
    color:#111827;
}

#title-sub{
    font-size:12px;
    color:#6b7280;
    margin-top:2px;
}

/* KPI */
.kpi{
    top:92px;
    width:220px;
    padding:14px;
}

#kpi1{left:18px;}
#kpi2{left:250px;}
#kpi3{left:482px;}

.kpi-label{
    font-size:11px;
    color:#6b7280;
    text-transform:uppercase;
    font-weight:700;
    letter-spacing:.4px;
}

.kpi-value{
    font-size:30px;
    font-weight:800;
    color:#111827;
    margin-top:6px;
}

/* legenda */
#legend{
    left:18px;
    bottom:24px;
    width:190px;
    padding:14px;
    font-size:12px;
    line-height:1.6;
}

/* mobile */
@media(max-width:768px){

#topbar{
    height:auto;
    padding:10px;
}

#title-main{
    font-size:16px;
}

.kpi{
    left:50% !important;
    transform:translateX(-50%);
    width:90%;
}

#kpi1{top:90px;}
#kpi2{top:175px;}
#kpi3{top:260px;}

.leaflet-top.leaflet-right .leaflet-control-layers{
    margin-top:350px !important;
}

#legend{
    width:88%;
    left:50%;
    transform:translateX(-50%);
    bottom:18px;
}
}
